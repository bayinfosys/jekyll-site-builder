name: image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t site-builder:test .

      - name: Smoke test
        run: |
          mkdir -p /tmp/site
          printf -- '---\ntitle: test\n---\n# hello\n' > /tmp/site/index.md
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v /tmp/site:/site site-builder:test
          test -f /tmp/site/_site/index.html

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          image="ghcr.io/${{ github.repository }}"
          docker tag site-builder:test "$image:$GITHUB_REF_NAME"
          docker tag site-builder:test "$image:latest"
          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:latest"
